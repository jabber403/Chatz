<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WhatsApp Chatz</title>
    <script src="https://8x8.vc/vpaas-magic-cookie-e89e2e4074c54ea58c423a0977fe348f/external_api.js" async></script>
    <style>
        /* Base Reset & Mobile Viewport CSS Variables */
        :root {
            --bg-dark: #0c1317;
            --panel-bg: #111b21;
            --header-bg: #202c33;
            --input-bg: #2a3942;
            --accent-green: #00a884;
            --accent-green-hover: #028a6c;
            --bubble-out: #005c4b;
            --bubble-in: #202c33;
            --text-primary: #e9edef;
            --text-muted: #8696a0;
            --blue-tick: #53bdeb;
            --danger-red: #ea4335;
            --warning-orange: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            height: 100dvh; /* Dynamic viewport height fix for mobile browsers */
            width: 100%;
            background-color: var(--bg-dark);
            color: var(--text-primary);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hidden { display: none !important; }

        /* Login Screen Modal */
        #loginScreen {
            background-color: var(--panel-bg);
            padding: 24px 20px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            z-index: 1000;
            max-height: 90vh;
            overflow-y: auto;
        }

        #loginScreen h2 {
            color: var(--accent-green);
            margin-bottom: 6px;
            font-size: 1.6rem;
        }

        #loginScreen p {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 16px;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        input, select {
            background-color: var(--input-bg);
            border: 1px solid transparent;
            color: var(--text-primary);
            padding: 12px 14px;
            border-radius: 8px;
            outline: none;
            font-size: 0.95rem;
            transition: border-color 0.2s;
            width: 100%;
        }

        input:focus {
            border-color: var(--accent-green);
        }

        button {
            background-color: var(--accent-green);
            color: var(--panel-bg);
            font-weight: 700;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--accent-green-hover);
        }

        .pfp-preview {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: 2px solid var(--accent-green);
            margin: 0 auto 10px;
            background: var(--header-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            overflow: hidden;
            object-fit: cover;
        }

        /* App Container Layout */
        #appContainer {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            background-color: var(--panel-bg);
            position: relative;
            overflow: hidden;
        }

        .sidebar {
            width: 340px;
            background-color: var(--panel-bg);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            z-index: 10;
            height: 100%;
        }

        .sidebar-header {
            background-color: var(--header-bg);
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 60px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--input-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-size: 1.2rem;
        }

        .user-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .sidebar-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 6px;
            border-radius: 50%;
        }

        .icon-btn:hover {
            background-color: var(--input-bg);
            color: var(--text-primary);
        }

        .notif-btn {
            font-size: 0.75rem;
            background: var(--input-bg);
            color: var(--accent-green);
            padding: 6px 10px;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .group-controls {
            padding: 10px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            gap: 8px;
            background: #182229;
        }

        .group-controls input {
            flex: 1;
            padding: 8px 12px;
            font-size: 0.85rem;
        }

        .group-controls button {
            padding: 8px 12px;
            font-size: 0.85rem;
            white-space: nowrap;
        }

        .contacts-list {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .section-header {
            padding: 8px 14px;
            font-size: 0.72rem;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 700;
            background-color: #182229;
            display: flex;
            justify-content: space-between;
            align-items: center;
            letter-spacing: 0.5px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            cursor: pointer;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            transition: background 0.15s;
            position: relative;
        }

        .contact-item:hover, .contact-item.active {
            background-color: var(--input-bg);
        }

        .unread-badge {
            background-color: var(--accent-green);
            color: var(--panel-bg);
            font-size: 0.7rem;
            font-weight: bold;
            border-radius: 12px;
            padding: 2px 7px;
            margin-left: auto;
        }

        .blocked-badge {
            background-color: var(--danger-red);
            color: #fff;
            font-size: 0.65rem;
            font-weight: bold;
            border-radius: 10px;
            padding: 2px 6px;
            margin-left: auto;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            margin-left: 6px;
        }

        .status-dot.online { background-color: var(--accent-green); }
        .status-dot.offline { background-color: var(--text-muted); }

        /* Chat Window Area */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-dark);
            position: relative;
            height: 100%;
        }

        .chat-header {
            background-color: var(--header-bg);
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 5;
            min-height: 60px;
        }

        .chat-header-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .call-btn, .block-btn {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            color: var(--accent-green);
            padding: 6px;
            border-radius: 50%;
        }

        .block-btn { color: var(--danger-red); }

        .call-btn:hover, .block-btn:hover {
            background-color: var(--input-bg);
        }

        .back-btn {
            display: none;
            background: none;
            border: none;
            color: var(--accent-green);
            font-size: 1.4rem;
            cursor: pointer;
            margin-right: 8px;
            padding: 4px;
        }

        .chat-body {
            flex: 1;
            padding: 14px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background-color: var(--bg-dark);
            background-size: cover;
            background-position: center;
        }

        /* Message Bubbles */
        .bubble {
            max-width: 82%;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.92rem;
            word-wrap: break-word;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        }

        .bubble.outgoing {
            align-self: flex-end;
            background-color: var(--bubble-out);
            border-top-right-radius: 0;
        }

        .bubble.incoming {
            align-self: flex-start;
            background-color: var(--bubble-in);
            border-top-left-radius: 0;
        }

        .sender-tag {
            font-size: 0.75rem;
            font-weight: bold;
            color: #e52e71;
            margin-bottom: 3px;
        }

        .enc-badge {
            font-size: 0.65rem;
            color: var(--text-muted);
            margin-bottom: 3px;
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .bubble-footer {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 4px;
            margin-top: 4px;
        }

        .bubble-time {
            font-size: 0.65rem;
            color: var(--text-muted);
        }

        .tick-icon {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: bold;
        }

        .tick-icon.read { color: var(--blue-tick); }

        .chat-img, .chat-video {
            max-width: 100%;
            max-height: 250px;
            border-radius: 8px;
            margin-top: 4px;
            object-fit: contain;
        }

        .chat-audio {
            width: 100%;
            max-width: 240px;
            margin-top: 6px;
        }

        .file-link {
            color: var(--blue-tick);
            text-decoration: none;
            font-weight: bold;
            margin-top: 4px;
            display: inline-block;
            word-break: break-all;
        }

        .reaction-bar {
            display: none;
            position: absolute;
            top: -34px;
            right: 0;
            background: var(--header-bg);
            border: 1px solid var(--accent-green);
            border-radius: 20px;
            padding: 3px 8px;
            gap: 6px;
            z-index: 50;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
        }

        .bubble:hover .reaction-bar { display: flex; }

        .reaction-btn {
            cursor: pointer;
            font-size: 1.05rem;
            transition: transform 0.15s;
        }

        .reaction-btn:hover { transform: scale(1.3); }

        .reactions-display {
            display: flex;
            gap: 4px;
            font-size: 0.75rem;
            margin-top: 4px;
            background: rgba(0, 0, 0, 0.25);
            padding: 2px 6px;
            border-radius: 10px;
            width: fit-content;
        }

        /* Block Banner Overlay */
        #blockedBanner {
            background-color: rgba(234, 67, 53, 0.15);
            border: 1px solid var(--danger-red);
            color: #ff8b8b;
            padding: 10px 14px;
            text-align: center;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        #blockedBanner button {
            background: var(--danger-red);
            color: #fff;
            padding: 4px 10px;
            font-size: 0.8rem;
            border-radius: 4px;
        }

        /* Footer Input Section */
        .chat-footer {
            background-color: var(--header-bg);
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            position: relative;
        }

        .chat-footer input[type="text"] {
            flex: 1;
            background-color: var(--input-bg);
            border-radius: 20px;
            padding: 10px 14px;
            font-size: 0.9rem;
        }

        /* Sticker & GIF Drawer Responsive */
        #mediaPickerDrawer {
            position: absolute;
            bottom: 60px;
            left: 10px;
            width: calc(100% - 20px);
            max-width: 340px;
            height: 300px;
            background-color: var(--header-bg);
            border: 1px solid var(--input-bg);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
            z-index: 100;
        }

        .picker-tabs {
            display: flex;
            background: var(--panel-bg);
            border-bottom: 1px solid var(--input-bg);
        }

        .picker-tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--text-muted);
        }

        .picker-tab.active {
            color: var(--accent-green);
            border-bottom: 2px solid var(--accent-green);
        }

        .picker-content {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            -webkit-overflow-scrolling: touch;
        }

        .sticker-item {
            font-size: 2.2rem;
            text-align: center;
            cursor: pointer;
            transition: transform 0.15s;
            user-select: none;
        }

        .sticker-item:hover { transform: scale(1.2); }

        .gif-item {
            width: 100%;
            height: 70px;
            object-fit: cover;
            border-radius: 6px;
            cursor: pointer;
            transition: transform 0.15s;
        }

        .gif-item:hover { transform: scale(1.05); }

        .record-btn {
            background: none;
            border: none;
            font-size: 1.3rem;
            cursor: pointer;
            color: var(--accent-green);
            padding: 4px;
        }

        .record-btn.recording {
            color: var(--danger-red);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        /* Call Popups & WebRTC Overlay */
        #incomingCallBox {
            position: absolute;
            top: 16px;
            right: 16px;
            left: 16px;
            margin: 0 auto;
            max-width: 320px;
            z-index: 300;
            background-color: var(--header-bg);
            border: 2px solid var(--accent-green);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
            text-align: center;
        }

        .call-actions {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .call-actions button { flex: 1; }

        .btn-success { background-color: var(--accent-green); color: var(--panel-bg); }
        .btn-danger { background-color: var(--danger-red); color: #fff; }

        #callOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: rgba(11, 20, 26, 0.98);
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        #jaas-container { 
            width: 100%; 
            height: calc(100% - 60px); 
        }

        .call-controls {
            height: 60px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--header-bg);
        }

        /* Responsive Mobile Layout Adjustments */
        @media (max-width: 768px) {
            .sidebar { 
                width: 100%; 
            }
            .chat-area { 
                width: 100%; 
            }
            .back-btn { 
                display: inline-block; 
            }
            #appContainer.chat-active .sidebar { 
                display: none; 
            }
            #appContainer.chat-active .chat-area { 
                display: flex; 
            }
            #appContainer:not(.chat-active) .chat-area { 
                display: none; 
            }
            .bubble {
                max-width: 88%;
            }
        }
    </style>
</head>
<body>

    <div id="loginScreen">
        <h2>WhatsApp Chatz</h2>
        <p>Connect with family and friends securely</p>
        <div class="pfp-preview" id="pfpPreview">👤</div>
        <form id="loginForm" class="login-form">
            <input type="text" id="usernameInput" placeholder="Username" required autocomplete="username">
            <input type="password" id="passwordInput" placeholder="Password" required autocomplete="current-password">
            
            <label style="font-size:0.8rem; color:var(--text-muted); text-align:left;">Profile Picture (File or Emoji):</label>
            <input type="file" id="pfpFileInput" accept="image/*">
            <input type="text" id="pfpEmojiInput" placeholder="Or type an emoji (e.g. 🦊, 🚀, 👑)">

            <button type="submit">Log In / Register</button>
        </form>
    </div>

    <div id="appContainer" class="hidden">
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="user-info">
                    <div class="user-avatar" id="myAvatarDisplay">👤</div>
                    <span id="myUsername" style="font-weight: 600;">Me</span>
                </div>
                <div class="sidebar-actions">
                    <button class="notif-btn" id="enableNotifBtn">🔔 Alerts</button>
                    <button class="icon-btn" id="logoutBtn" title="Log Out">🚪</button>
                </div>
            </div>

            <div class="group-controls">
                <input type="text" id="groupNameInput" placeholder="Group Room Name...">
                <button id="joinGroupBtn">Join/Create</button>
            </div>

            <div class="contacts-list">
                <div class="section-header">Group Rooms</div>
                <div id="groupsList"></div>

                <div class="section-header">Direct Messages</div>
                <div id="contactsList"></div>
            </div>
        </div>

        <div class="chat-area">
            <div id="emptyView" style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--text-muted); gap:10px; padding:20px; text-align:center;">
                <span style="font-size: 3rem;">💬</span>
                <p>Select a direct contact or join a group room to start chatting.</p>
            </div>

            <div id="activeChatView" class="hidden" style="display: flex; flex-direction: column; height: 100%;">
                <div class="chat-header">
                    <div style="display: flex; align-items: center; overflow: hidden;">
                        <button class="back-btn" id="backToSidebarBtn">←</button>
                        <div style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
                            <div id="activeContactName" style="font-weight: 600; text-overflow: ellipsis; overflow: hidden;">User</div>
                            <div id="activeStatusSub" style="font-size: 0.72rem; color: var(--accent-green); text-overflow: ellipsis; overflow: hidden;">🔒 Encrypted Channel</div>
                        </div>
                    </div>
                    <div class="chat-header-actions">
                        <label title="Set Custom Background" style="cursor:pointer; font-size:1.2rem; padding: 4px;">
                            🎨 <input type="file" id="bgFileInput" accept="image/*" style="display:none;">
                        </label>
                        <button class="call-btn" id="audioCallBtn" title="Audio Call">📞</button>
                        <button class="call-btn" id="videoCallBtn" title="Video Call">📹</button>
                        <button class="block-btn" id="blockToggleBtn" title="Block/Unblock User">🚫</button>
                    </div>
                </div>

                <div id="blockedBanner" class="hidden">
                    <span>Contact blocked.</span>
                    <button id="unblockBannerBtn">Unblock</button>
                </div>

                <div class="chat-body" id="chatBody"></div>

                <div id="mediaPickerDrawer" class="hidden">
                    <div class="picker-tabs">
                        <div class="picker-tab active" id="stickersTabBtn">Stickers</div>
                        <div class="picker-tab" id="gifsTabBtn">GIFs</div>
                    </div>
                    <div class="picker-content" id="pickerContent"></div>
                </div>

                <form id="chatForm" class="chat-footer">
                    <button type="button" id="togglePickerBtn" style="background:none; border:none; font-size:1.3rem; cursor:pointer;" title="Stickers & GIFs">👾</button>
                    <label style="cursor:pointer; font-size:1.2rem; padding:2px;" title="Attach File">
                        📎 <input type="file" id="fileInput" style="display:none;">
                    </label>
                    <input type="text" id="messageInput" placeholder="Type a message..." autocomplete="off">
                    <button type="button" class="record-btn" id="voiceRecordBtn" title="Record Voice Note">🎙️</button>
                    <button type="submit" style="border-radius: 50%; width:40px; height:40px; min-width:40px; display:flex; align-items:center; justify-content:center; padding:0;">➤</button>
                </form>
            </div>

            <div id="incomingCallBox" class="hidden">
                <div id="incomingCallText" style="font-weight: bold; font-size: 0.95rem;">Incoming Call...</div>
                <div class="call-actions">
                    <button id="acceptIncomingCallBtn" class="btn-success">Accept</button>
                    <button id="declineIncomingCallBtn" class="btn-danger">Decline</button>
                </div>
            </div>

            <div id="callOverlay" class="hidden">
                <div id="jaas-container"></div>
                <div class="call-controls">
                    <button id="endCallBtn" class="btn-danger" style="padding: 10px 24px;">End Call</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io({ reconnection: true, reconnectionDelay: 1000 });

        // DOM Elements
        const loginScreen = document.getElementById('loginScreen');
        const appContainer = document.getElementById('appContainer');
        const loginForm = document.getElementById('loginForm');
        const usernameInput = document.getElementById('usernameInput');
        const passwordInput = document.getElementById('passwordInput');
        const pfpFileInput = document.getElementById('pfpFileInput');
        const pfpEmojiInput = document.getElementById('pfpEmojiInput');
        const pfpPreview = document.getElementById('pfpPreview');

        const myUsername = document.getElementById('myUsername');
        const myAvatarDisplay = document.getElementById('myAvatarDisplay');
        const enableNotifBtn = document.getElementById('enableNotifBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const contactsList = document.getElementById('contactsList');
        const groupsList = document.getElementById('groupsList');
        const groupNameInput = document.getElementById('groupNameInput');
        const joinGroupBtn = document.getElementById('joinGroupBtn');

        const emptyView = document.getElementById('emptyView');
        const activeChatView = document.getElementById('activeChatView');
        const activeContactName = document.getElementById('activeContactName');
        const activeStatusSub = document.getElementById('activeStatusSub');
        const chatBody = document.getElementById('chatBody');
        const chatForm = document.getElementById('chatForm');
        const messageInput = document.getElementById('messageInput');
        const fileInput = document.getElementById('fileInput');
        const bgFileInput = document.getElementById('bgFileInput');
        const backToSidebarBtn = document.getElementById('backToSidebarBtn');

        /* Safe Audio Alerts for Mobile */
        function playAlertSound() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();

                if (ctx.state === 'suspended') {
                    ctx.resume();
                }

                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.15);

                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start();
                osc.stop(ctx.currentTime + 0.25);
            } catch(e) {}
        }

        /* Encryption Helpers */
        function encryptDecrypt(text, keyString) {
            let result = '';
            for (let i = 0; i < text.length; i++) {
                result += String.fromCharCode(text.charCodeAt(i) ^ keyString.charCodeAt(i % keyString.length));
            }
            return btoa(result);
        }

        function decrypt(cipherBase64, keyString) {
            try {
                let decoded = atob(cipherBase64);
                let result = '';
                for (let i = 0; i < decoded.length; i++) {
                    result += String.fromCharCode(decoded.charCodeAt(i) ^ keyString.charCodeAt(i % keyString.length));
                }
                return result;
            } catch(e) { return cipherBase64; }
        }

        function getSharedSecret(userA, userB) {

        function sendDirectPayload(msgText, fileData, fileType, fileName) {
            if (!activeTarget) return;

            if (!isGroupChat && blockedUsers.has(activeTarget)) {
                alert('You cannot send messages to a blocked contact.');
                return;
            }

            let msgData = msgText;

            if (!isGroupChat && msgText) {
                const secret = getSharedSecret(currentUser, activeTarget);
                msgData = encryptDecrypt(msgText, secret);
            }

            socket.emit('sendMessage', {
                recipient: isGroupChat ? null : activeTarget,
                room: isGroupChat ? activeTarget : null,
                message: msgData,
                fileData: fileData || '',
                fileName: fileName || '',
                fileType: fileType || ''
            });
        }

        socket.on('receiveMessage', (data) => {
            const secret = (!data.room && data.sender) ? getSharedSecret(currentUser, data.sender === currentUser ? data.recipient : data.sender) : null;

            const matchesDirect = !isGroupChat && ((data.sender === currentUser && data.recipient === activeTarget) || (data.sender === activeTarget && data.recipient === currentUser));
            const matchesGroup = isGroupChat && data.room === activeTarget;

            if (matchesDirect || matchesGroup) {

        function appendBubble(data) {
            if (document.getElementById(`msg-${data.id}`)) return;

            const isOutgoing = data.sender === currentUser;
            const bubble = document.createElement('div');
            bubble.classList.add('bubble', isOutgoing ? 'outgoing' : 'incoming');
            bubble.id = `msg-${data.id}`;

            let bodyContent = `
                <div class="reaction-bar">
                    <span class="reaction-btn" onclick="reactToMessage(${data.id}, '❤️')">❤️</span>
                    <span class="reaction-btn" onclick="reactToMessage(${data.id}, '😂')">😂</span>
                    <span class="reaction-btn" onclick="reactToMessage(${data.id}, '👍')">👍</span>
                    <span class="reaction-btn" onclick="reactToMessage(${data.id}, '😮')">😮</span>
                    <span class="reaction-btn" onclick="reactToMessage(${data.id}, '🔥')">🔥</span>
                </div>
            `;

            if (isGroupChat && !isOutgoing) {
                bodyContent += `<div class="sender-tag">${data.sender}</div>`;
            } else if (!isGroupChat) {
                bodyContent += `<div class="enc-badge">🔒 Encrypted</div>`;
            }

            if (data.decryptedMessage) {
                bodyContent += `<div>${data.decryptedMessage}</div>`;
            }

            if (data.fileData) {
                const type = data.fileType || '';
                if (type === 'sticker') {
                    bodyContent += `<div style="font-size: 4rem; text-align: center;">${data.fileData}</div>`;
                } else if (type.startsWith('image/')) {
                    bodyContent += `<img src="${data.fileData}" class="chat-img" />`;
                } else if (type.startsWith('video/')) {
                    bodyContent += `<video src="${data.fileData}" controls class="chat-video"></video>`;
                } else if (type.startsWith('audio/')) {
                    bodyContent += `<audio src="${data.fileData}" controls class="chat-audio"></audio>`;
                } else {
                    bodyContent += `<a href="${data.fileData}" download="${data.fileName || 'download'}" class="file-link">💾 Download ${data.fileName || 'File'}</a>`;
                }
            }

            let tickStr = '';
            let tickClass = 'tick-icon';

            if (isOutgoing && !isGroupChat) {
                if (data.status === 'read') {
                    tickStr = '✓✓';
                    tickClass = 'tick-icon read';
                } else if (data.status === 'delivered') {
                    tickStr = '✓✓';
                } else {
                    tickStr = '✓';
                }
            }

            const parsedReactions = JSON.parse(data.reactions || '{}');
            const emojisStr = [...new Set(Object.values(parsedReactions))].join(' ');

            bodyContent += `
                <div class="reactions-display">${emojisStr}</div>
                <div class="bubble-footer">
                    <span class="bubble-time">${data.time || ''}</span>
                    ${isOutgoing && !isGroupChat ? `<span class="${tickClass}">${tickStr}</span>` : ''}
                </div>
            `;

            bubble.innerHTML = bodyContent;
            chatBody.appendChild(bubble);
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        /* 8x8 JaaS WebRTC Call Handler */
        function launchCall(startWithAudioOnly) {
            if (!activeTarget) return;

            if (!isGroupChat && blockedUsers.has(activeTarget)) {
                alert('Cannot initiate call with a blocked contact.');
                return;
            }

            // Generate JaaS specific room path under your magic cookie tenant space
            const roomSuffix = isGroupChat 
                ? `group-${activeTarget.toLowerCase().replace(/[^a-z0-9]/g, '')}`
                : `dm-${[currentUser, activeTarget].sort().join('-')}`;
            
            const jaasRoomName = `vpaas-magic-cookie-e89e2e4074c54ea58c423a0977fe348f/${roomSuffix}`;

            socket.emit('startCallNotification', {
                target: activeTarget,
                isGroup: isGroupChat,
                callRoomName: jaasRoomName,
                isAudioOnly: startWithAudioOnly
            });

            join8x8JaasRoom(jaasRoomName, startWithAudioOnly);
        }

        function join8x8JaasRoom(callRoomName, startWithAudioOnly) {
            callOverlay.classList.remove('hidden');
            incomingCallBox.classList.add('hidden');
            jaasContainer.innerHTML = '';

            if (typeof JitsiMeetExternalAPI === 'undefined') {
                alert('8x8 Video SDK is still loading, please try again in a moment.');
                callOverlay.classList.add('hidden');
                return;
            }

            const options = {
                roomName: callRoomName,
                width: '100%',
                height: '100%',
                parentNode: jaasContainer,
                userInfo: { displayName: currentUser },
                configOverwrite: {
                    startAudioOnly: startWithAudioOnly,
                    disableDeepLinking: true,
                    prejoinPageEnabled: false,
                    enableWelcomePage: false,
                    startWithAudioMuted: false,
                    startWithVideoMuted: startWithAudioOnly,
                    resolution: 360,
                    p2p: { enabled: true }
                },
                interfaceConfigOverwrite: {
                    TOOLBAR_BUTTONS: ['microphone', 'camera', 'desktop', 'hangup', 'tileview'],
                    SHOW_JITSI_WATERMARK: false
                }
            };

            // Instantiate JaaS WebRTC Call API on 8x8.vc domain
            jitsiApi = new JitsiMeetExternalAPI("8x8.vc", options);

            const iframe = jitsiApi.getIFrame();
            if (iframe) {
                iframe.setAttribute('allow', 'camera; microphone; display-capture; autoplay; clipboard-write');
            }

            jitsiApi.addEventListeners({
                videoConferenceLeft: closeCallUI
            });
        }

        socket.on('incomingCall', (data) => {
            currentIncomingCall = data;
            const type = data.isAudioOnly ? 'Audio' : 'Video';
            const fromText = data.isGroup ? `in #${data.groupName} from ${data.from}` : `from ${data.from}`;

            incomingCallText.textContent = `Incoming ${type} Call ${fromText}`;
            incomingCallBox.classList.remove('hidden');

            triggerNativeNotification(
                `Incoming ${type} Call`,
                `Incoming call ${fromText}`
            );
        });

        acceptIncomingCallBtn.onclick = () => {
            if (currentIncomingCall) {
                join8x8JaasRoom(currentIncomingCall.callRoomName, currentIncomingCall.isAudioOnly);
            }
        };

        declineIncomingCallBtn.onclick = () => {
            if (currentIncomingCall && !currentIncomingCall.isGroup) {
                socket.emit('declineCall', { to: currentIncomingCall.from });
            }
            incomingCallBox.classList.add('hidden');
            currentIncomingCall = null;
        };

        socket.on('callDeclined', ({ from }) => {
            alert(`${from} declined the call.`);
            closeCallUI();
        });

        endCallBtn.onclick = closeCallUI;

        function closeCallUI() {
            if (jitsiApi) {
                jitsiApi.dispose();
                jitsiApi = null;
            }
            callOverlay.classList.add('hidden');
            incomingCallBox.classList.add('hidden');
            jaasContainer.innerHTML = '';
        }

        audioCallBtn.onclick = () => launchCall(true);
        videoCallBtn.onclick = () => launchCall(false);
    </script>
</body>
</html>
