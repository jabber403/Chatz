<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chatz</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0c1317; color: #e9edef; height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }

        .hidden { display: none !important; }

        /* AUTH CONTAINER */
        #authContainer { background-color: #111b21; padding: 30px; border-radius: 12px; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        #authContainer h2 { color: #00a884; margin-bottom: 10px; }
        
        .auth-tabs { display: flex; border-bottom: 2px solid #2a3942; margin-bottom: 20px; }
        .auth-tab { flex: 1; padding: 10px; cursor: pointer; font-weight: bold; color: #8696a0; }
        .auth-tab.active { color: #00a884; border-bottom: 2px solid #00a884; }

        .login-form { display: flex; flex-direction: column; gap: 12px; }
        input, select { background-color: #2a3942; border: none; color: #d1d7db; padding: 12px; border-radius: 8px; outline: none; font-size: 1rem; }
        button { background-color: #00a884; color: #111b21; font-weight: 700; padding: 12px; border: none; border-radius: 8px; cursor: pointer; }

        .pfp-preview { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; border: 2px solid #00a884; margin: 0 auto 10px; background: #202c33; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; }

        /* MAIN APP */
        #appContainer { width: 100vw; height: 100vh; display: flex; background-color: #111b21; position: relative; }
        .sidebar { width: 320px; background-color: #111b21; border-right: 1px solid #222d34; display: flex; flex-direction: column; height: 100%; flex-shrink: 0; }
        .sidebar-header { background-color: #202c33; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .user-avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; background: #2a3942; display: flex; align-items: center; justify-content: center; overflow: hidden; }

        .group-controls { padding: 10px; border-bottom: 1px solid #222d34; display: flex; gap: 8px; }
        .group-controls input { flex: 1; padding: 8px; font-size: 0.85rem; }
        .group-controls button { padding: 8px 12px; font-size: 0.85rem; }

        .contacts-list { flex: 1; overflow-y: auto; }
        .section-header { padding: 8px 16px; font-size: 0.75rem; text-transform: uppercase; color: #8696a0; font-weight: bold; background-color: #182229; }
        .contact-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; cursor: pointer; border-bottom: 1px solid #1f2c33; }
        .contact-item.active { background-color: #2a3942; }

        .chat-area { flex: 1; display: flex; flex-direction: column; background-color: #0b141a; position: relative; height: 100%; }
        .chat-header { background-color: #202c33; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #222d34; gap: 8px; }
        .chat-header-actions { display: flex; gap: 12px; align-items: center; }
        .call-btn { background: none; border: none; font-size: 1.3rem; cursor: pointer; color: #00a884; }

        .mobile-back-btn { display: none; background: none; border: none; color: #00a884; font-size: 1.5rem; cursor: pointer; padding-right: 8px; }

        .logout-btn { background: none; border: none; color: #ea4335; font-size: 0.8rem; cursor: pointer; font-weight: bold; }

        .chat-body { 
            flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; 
            background-color: #0b141a; background-size: cover; background-position: center; transition: background 0.3s;
        }

        .bubble { max-width: 75%; padding: 8px 12px; border-radius: 8px; font-size: 0.9rem; word-wrap: break-word; display: flex; flex-direction: column; position: relative; }
        .bubble.outgoing { align-self: flex-end; background-color: #005c4b; }
        .bubble.incoming { align-self: flex-start; background-color: #202c33; }
        .sender-tag { font-size: 0.75rem; font-weight: bold; color: #e52e71; margin-bottom: 4px; }
        
        .bubble-footer { display: flex; align-items: center; justify-content: flex-end; gap: 4px; margin-top: 4px; }
        .bubble-time { font-size: 0.65rem; color: #8696a0; }
        .tick-icon { font-size: 0.75rem; color: #8696a0; font-weight: bold; }
        .tick-icon.read { color: #53bdeb; }

        .chat-img, .chat-video { max-width: 100%; max-height: 250px; border-radius: 8px; margin-top: 4px; }
        .chat-audio { max-width: 100%; margin-top: 4px; }

        .reaction-bar { display: none; position: absolute; top: -35px; right: 0; background: #202c33; border: 1px solid #00a884; border-radius: 20px; padding: 2px 8px; gap: 6px; z-index: 50; }
        .bubble:hover .reaction-bar { display: flex; }
        .reaction-btn { cursor: pointer; font-size: 1rem; transition: transform 0.1s; }
        .reaction-btn:hover { transform: scale(1.3); }
        .reactions-display { display: flex; gap: 4px; font-size: 0.75rem; margin-top: 4px; background: rgba(0,0,0,0.2); padding: 2px 6px; border-radius: 10px; width: fit-content; }

        .chat-footer { background-color: #202c33; padding: 10px 16px; display: flex; align-items: center; gap: 8px; position: relative; }
        .chat-footer input[type="text"] { flex: 1; background-color: #2a3942; }

        #mediaPickerDrawer {
            position: absolute; bottom: 65px; left: 16px; width: 300px; height: 260px;
            background-color: #202c33; border: 1px solid #2a3942; border-radius: 12px;
            display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 100;
        }
        .picker-tabs { display: flex; background: #111b21; border-bottom: 1px solid #2a3942; }
        .picker-tab { flex: 1; padding: 8px; text-align: center; cursor: pointer; font-size: 0.85rem; font-weight: bold; color: #8696a0; }
        .picker-tab.active { color: #00a884; border-bottom: 2px solid #00a884; }
        .picker-content { flex: 1; padding: 10px; overflow-y: auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .sticker-item { font-size: 2.2rem; text-align: center; cursor: pointer; }
        .gif-item { width: 100%; height: 70px; object-fit: cover; border-radius: 6px; cursor: pointer; }

        .record-btn { background: none; border: none; font-size: 1.3rem; cursor: pointer; color: #00a884; }
        .record-btn.recording { color: #ea4335; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

        /* INCOMING CALL MODAL (PHONE / MESSAGING STYLE) */
        #incomingCallModal {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(11, 20, 26, 0.95); backdrop-filter: blur(8px);
            z-index: 500; display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            padding: 60px 20px; text-align: center;
        }
        .caller-avatar {
            width: 110px; height: 110px; border-radius: 50%; object-fit: cover;
            border: 4px solid #00a884; margin-bottom: 15px; font-size: 3.5rem;
            display: flex; align-items: center; justify-content: center; background: #202c33;
            animation: ringPulse 1.5s infinite;
        }
        @keyframes ringPulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 168, 132, 0.7); }
            70% { box-shadow: 0 0 0 25px rgba(0, 168, 132, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 168, 132, 0); }
        }
        .caller-name { font-size: 1.8rem; font-weight: bold; margin-bottom: 8px; color: #e9edef; }
        .call-type-subtitle { font-size: 1.1rem; color: #00a884; font-weight: 500; }
        .call-action-btns { display: flex; gap: 40px; width: 100%; max-width: 300px; justify-content: center; }
        .call-action-btn {
            width: 70px; height: 70px; border-radius: 50%; border: none; font-size: 1.8rem;
            display: flex; align-items: center; justify-content: center; cursor: pointer; color: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        .btn-accept { background-color: #00a884; }
        .btn-decline { background-color: #ea4335; }

        /* CALL OVERLAY */
        #callOverlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 20, 26, 0.98); z-index: 200;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        #jitsiContainer { width: 100%; height: 85%; }
        .call-controls { height: 15%; display: flex; align-items: center; justify-content: center; gap: 16px; }

        @media (max-width: 768px) {
            .sidebar { width: 100%; }
            .chat-area { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 20; display: none; }
            .chat-area.mobile-active { display: flex; }
            .mobile-back-btn { display: inline-block; }
            .bubble { max-width: 85%; }
            #mediaPickerDrawer { width: 90%; left: 5%; }
        }
    </style>
    <script src="https://meet.jit.si/external_api.js"></script>
</head>
<body>

    <div id="authContainer">
        <h2>Chatz</h2>
        <div class="auth-tabs">
            <div class="auth-tab active" id="tabLogin">Log In</div>
            <div class="auth-tab" id="tabSignup">Sign Up</div>
        </div>

        <div class="pfp-preview" id="pfpPreview">👤</div>
        <form id="authForm" class="login-form">
            <input type="text" id="usernameInput" placeholder="Username" required>
            <input type="password" id="passwordInput" placeholder="Password" required>
            
            <div id="pfpFields" class="hidden">
                <label style="font-size:0.8rem; color:#8696a0; text-align:left; display:block; margin-top:4px;">Custom Avatar (File or Emoji):</label>
                <input type="file" id="pfpFileInput" accept="image/*">
                <input type="text" id="pfpEmojiInput" placeholder="Or enter emoji (e.g. 🦊, 👑)">
            </div>

            <button type="submit" id="authSubmitBtn">Log In</button>
        </form>
    </div>

    <div id="appContainer" class="hidden">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="user-info">
                    <div class="user-avatar" id="myAvatarDisplay">👤</div>
                    <span id="myUsername" style="font-weight: 600;">Me</span>
                </div>
                <div style="display:flex; align-items:center; gap:10px;">
                    <span style="font-size: 0.75rem; color: #00a884;">🔒 Online</span>
                    <button class="logout-btn" id="logoutBtn">Logout</button>
                </div>
            </div>

            <div class="group-controls">
                <input type="text" id="groupNameInput" placeholder="Group Name...">
                <button id="joinGroupBtn">Join/Create</button>
            </div>

            <div class="contacts-list">
                <div class="section-header">Group Rooms</div>
                <div id="groupsList"></div>

                <div class="section-header">Direct Messages</div>
                <div id="contactsList"></div>
            </div>
        </div>

        <div class="chat-area" id="chatArea">
            <div id="emptyView" style="flex:1; display:flex; align-items:center; justify-content:center; color:#8696a0; padding:20px; text-align:center;">
                Select a direct message or group room to start chatting.
            </div>

            <div id="activeChatView" class="hidden" style="display: flex; flex-direction: column; height: 100%;">
                <div class="chat-header">
                    <div style="display:flex; align-items:center;">
                        <button class="mobile-back-btn" id="mobileBackBtn">←</button>
                        <div>
                            <div id="activeContactName" style="font-weight: 600;">User</div>
                            <div id="activeStatusSub" style="font-size: 0.75rem; color: #00a884;">🔒 Encrypted Channel</div>
                        </div>
                    </div>
                    <div class="chat-header-actions">
                        <label title="Set Custom Background" style="cursor:pointer; font-size:1.2rem;">
                            🎨 <input type="file" id="bgFileInput" accept="image/*" style="display:none;">
                        </label>
                        <button class="call-btn" id="audioCallBtn" title="Audio Call">📞</button>
                        <button class="call-btn" id="videoCallBtn" title="Video Call">📹</button>
                    </div>
                </div>

                <div class="chat-body" id="chatBody"></div>

                <div id="mediaPickerDrawer" class="hidden">
                    <div class="picker-tabs">
                        <div class="picker-tab active" id="stickersTabBtn">Stickers</div>
                        <div class="picker-tab" id="gifsTabBtn">GIFs</div>
                    </div>
                    <div class="picker-content" id="pickerContent"></div>
                </div>

                <form id="chatForm" class="chat-footer">
                    <button type="button" id="togglePickerBtn" style="background:none; border:none; font-size:1.3rem; cursor:pointer;" title="Stickers & GIFs">👾</button>
                    <label style="cursor:pointer; font-size:1.2rem;" title="Attach File">
                        📎 <input type="file" id="fileInput" style="display:none;">
                    </label>
                    <input type="text" id="messageInput" placeholder="Type a message..." autocomplete="off">
                    <button type="button" class="record-btn" id="voiceRecordBtn" title="Record Voice Note">🎙️</button>
                    <button type="submit" style="border-radius: 50%; width:40px; height:40px;">➤</button>
                </form>
            </div>

            <div id="incomingCallModal" class="hidden">
                <div>
                    <div class="caller-avatar" id="callerAvatarDisplay">👤</div>
                    <div class="caller-name" id="callerNameDisplay">Incoming Caller</div>
                    <div class="call-type-subtitle" id="callTypeSubtitle">Incoming Video Call...</div>
                </div>
                <div class="call-action-btns">
                    <button class="call-action-btn btn-decline" id="declineIncomingCallBtn">✕</button>
                    <button class="call-action-btn btn-accept" id="acceptIncomingCallBtn">📞</button>
                </div>
            </div>

            <div id="callOverlay" class="hidden">
                <div id="jitsiContainer"></div>
                <div class="call-controls">
                    <button id="endCallBtn" class="logout-btn" style="background-color:#ea4335; color:#fff; padding:10px 20px; border-radius:8px; font-size:1rem;">Leave Call</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io({ reconnection: true, reconnectionDelay: 1000 });

        const authContainer = document.getElementById('authContainer');
        const tabLogin = document.getElementById('tabLogin');
        const tabSignup = document.getElementById('tabSignup');
        const authForm = document.getElementById('authForm');
        const authSubmitBtn = document.getElementById('authSubmitBtn');
        const pfpFields = document.getElementById('pfpFields');

        const appContainer = document.getElementById('appContainer');
        const usernameInput = document.getElementById('usernameInput');
        const passwordInput = document.getElementById('passwordInput');
        const pfpFileInput = document.getElementById('pfpFileInput');
        const pfpEmojiInput = document.getElementById('pfpEmojiInput');
        const pfpPreview = document.getElementById('pfpPreview');

        const myUsername = document.getElementById('myUsername');
        const myAvatarDisplay = document.getElementById('myAvatarDisplay');
        const logoutBtn = document.getElementById('logoutBtn');
        const contactsList = document.getElementById('contactsList');
        const groupsList = document.getElementById('groupsList');
        const groupNameInput = document.getElementById('groupNameInput');
        const joinGroupBtn = document.getElementById('joinGroupBtn');

        const chatArea = document.getElementById('chatArea');
        const mobileBackBtn = document.getElementById('mobileBackBtn');

        const emptyView = document.getElementById('emptyView');
        const activeChatView = document.getElementById('activeChatView');
        const activeContactName = document.getElementById('activeContactName');
        const activeStatusSub = document.getElementById('activeStatusSub');
        const chatBody = document.getElementById('chatBody');
        const chatForm = document.getElementById('chatForm');
        const messageInput = document.getElementById('messageInput');
        const fileInput = document.getElementById('fileInput');
        const bgFileInput = document.getElementById('bgFileInput');

        const mediaPickerDrawer = document.getElementById('mediaPickerDrawer');
        const togglePickerBtn = document.getElementById('togglePickerBtn');
        const stickersTabBtn = document.getElementById('stickersTabBtn');
        const gifsTabBtn = document.getElementById('gifsTabBtn');
        const pickerContent = document.getElementById('pickerContent');

        const voiceRecordBtn = document.getElementById('voiceRecordBtn');

        const incomingCallModal = document.getElementById('incomingCallModal');
        const callerAvatarDisplay = document.getElementById('callerAvatarDisplay');
        const callerNameDisplay = document.getElementById('callerNameDisplay');
        const callTypeSubtitle = document.getElementById('callTypeSubtitle');
        const acceptIncomingCallBtn = document.getElementById('acceptIncomingCallBtn');
        const declineIncomingCallBtn = document.getElementById('declineIncomingCallBtn');

        const callOverlay = document.getElementById('callOverlay');
        const jitsiContainer = document.getElementById('jitsiContainer');
        const endCallBtn = document.getElementById('endCallBtn');
        const audioCallBtn = document.getElementById('audioCallBtn');
        const videoCallBtn = document.getElementById('videoCallBtn');

        let isSignupMode = false;
        let currentUser = "";
        let currentPassword = "";
        let currentPfp = "👤";
        let activeTarget = null;
        let isGroupChat = false;
        let joinedGroups = new Set();
        let jitsiApi = null;
        let currentIncomingCall = null;
        let typingTimeout = null;

        let selectedFileData = "";
        let selectedFileName = "";
        let selectedFileType = "";

        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;

        const STICKERS = ['🔥', '👑', '🎉', '💩', '😎', '❤️', '🚀', '💯', '🍕', '🐱', '👻', '⭐'];
        const SAMPLE_GIFS = [
            'https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExbnFlc2p4amR2eTNqem9kcnE3OHZlYzB4Mmtic2plZnVrbjhhNzV4OCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/l0HlHJGHe3yAMhdQY/giphy.gif',
            'https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExcDdxMnRzNHU3eDRjYmVqcncybmhyMXpncHRvNmRrcXR3OTI5c3V2OCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/3o7TKsjRrfIPjeiVyM/giphy.gif',
            'https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExc2J1bjNsc3B6bWFndXByenR1am96aGVidDRiZHFlZXRkMmdyM2tzMiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/l41K3o5TKSFi88C5O/giphy.gif'
        ];

        // PUSH NOTIFICATION REQUEST
        function requestNotificationPermission() {
            if ("Notification" in window && Notification.permission !== "granted") {
                Notification.requestPermission();
            }
        }

        function triggerPushNotification(title, options) {
            if ("Notification" in window && Notification.permission === "granted" && document.hidden) {
                new Notification(title, options);
            }
        }

        // TOGGLE LOGIN / SIGNUP TABS
        tabLogin.onclick = () => {
            isSignupMode = false;
            tabLogin.classList.add('active');
            tabSignup.classList.remove('active');
            pfpFields.classList.add('hidden');
            authSubmitBtn.textContent = 'Log In';
        };

        tabSignup.onclick = () => {
            isSignupMode = true;
            tabSignup.classList.add('active');
            tabLogin.classList.remove('active');
            pfpFields.classList.remove('hidden');
            authSubmitBtn.textContent = 'Sign Up';
        };

        // AUTO-LOGIN PERSISTENCE
        window.addEventListener('DOMContentLoaded', () => {
            const savedUser = localStorage.getItem('chatz_saved_session');
            if (savedUser) {
                try {
                    const parsed = JSON.parse(savedUser);
                    currentUser = parsed.username;
                    currentPassword = parsed.password;
                    currentPfp = parsed.pfp || "👤";
                    socket.emit('login', { username: currentUser, password: currentPassword, pfp: currentPfp, isSignup: false });
                } catch(e) {}
            }
        });

        pfpFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (evt) => {
                    currentPfp = evt.target.result;
                    pfpPreview.innerHTML = `<img src="${currentPfp}" style="width:100%; height:100%; border-radius:50%; object-fit:cover;">`;
                };
                reader.readAsDataURL(file);
            }
        });

        pfpEmojiInput.addEventListener('input', (e) => {
            if (e.target.value.trim()) {
                currentPfp = e.target.value.trim();
                pfpPreview.innerHTML = currentPfp;
            }
        });

        bgFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (evt) => {
                    chatBody.style.backgroundImage = `url(${evt.target.result})`;
                };
                reader.readAsDataURL(file);
            }
        });

        togglePickerBtn.onclick = () => {
            mediaPickerDrawer.classList.toggle('hidden');
            loadStickers();
        };

        stickersTabBtn.onclick = () => {
            stickersTabBtn.classList.add('active');
            gifsTabBtn.classList.remove('active');
            loadStickers();
        };

        gifsTabBtn.onclick = () => {
            gifsTabBtn.classList.add('active');
            stickersTabBtn.classList.remove('active');
            loadGifs();
        };

        function loadStickers() {
            pickerContent.innerHTML = '';
            pickerContent.style.gridTemplateColumns = 'repeat(4, 1fr)';
            STICKERS.forEach(stk => {
                const div = document.createElement('div');
                div.classList.add('sticker-item');
                div.textContent = stk;
                div.onclick = () => {
                    sendDirectPayload('', stk, 'sticker', 'sticker.txt');
                    mediaPickerDrawer.classList.add('hidden');
                };
                pickerContent.appendChild(div);
            });
        }

        function loadGifs() {
            pickerContent.innerHTML = '';
            pickerContent.style.gridTemplateColumns = 'repeat(2, 1fr)';
            SAMPLE_GIFS.forEach(url => {
                const img = document.createElement('img');
                img.src = url;
                img.classList.add('gif-item');
                img.onclick = () => {
                    sendDirectPayload('', url, 'image/gif', 'animation.gif');
                    mediaPickerDrawer.classList.add('hidden');
                };
                pickerContent.appendChild(img);
            });
        }

        voiceRecordBtn.onclick = async () => {
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.onload = (evt) => {
                            sendDirectPayload('', evt.target.result, 'audio/webm', 'voice-note.webm');
                        };
                        reader.readAsDataURL(audioBlob);
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    voiceRecordBtn.classList.add('recording');
                } catch(e) {
                    alert('Microphone access is required.');
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                voiceRecordBtn.classList.remove('recording');
            }
        };

        function encryptDecrypt(text, keyString) {
            let result = '';
            for (let i = 0; i < text.length; i++) {
                result += String.fromCharCode(text.charCodeAt(i) ^ keyString.charCodeAt(i % keyString.length));
            }
            return btoa(result);
        }

        function decrypt(cipherBase64, keyString) {
            try {
                let decoded = atob(cipherBase64);
                let result = '';
                for (let i = 0; i < decoded.length; i++) {
                    result += String.fromCharCode(decoded.charCodeAt(i) ^ keyString.charCodeAt(i % keyString.length));
                }
                return result;
            } catch(e) { return cipherBase64; }
        }

        function getSharedSecret(userA, userB) {
            return [userA, userB].sort().join('-secret-key-2026');
        }

        authForm.addEventListener('submit', (e) => {
            e.preventDefault();
            currentUser = usernameInput.value.trim();
            currentPassword = passwordInput.value;
            requestNotificationPermission();
            socket.emit('login', { username: currentUser, password: currentPassword, pfp: currentPfp, isSignup: isSignupMode });
        });

        socket.on('loginResponse', (res) => {
            if (res.success) {
                myUsername.textContent = currentUser;
                if (currentPfp.startsWith('data:image')) {
                    myAvatarDisplay.innerHTML = `<img src="${currentPfp}" style="width:100%; height:100%; border-radius:50%; object-fit:cover;">`;
                } else {
                    myAvatarDisplay.textContent = currentPfp;
                }

                localStorage.setItem('chatz_saved_session', JSON.stringify({
                    username: currentUser,
                    password: currentPassword,
                    pfp: currentPfp
                }));

                authContainer.classList.add('hidden');
                appContainer.classList.remove('hidden');
            } else {
                alert(res.msg);
                localStorage.removeItem('chatz_saved_session');
            }
        });

        logoutBtn.onclick = () => {
            localStorage.removeItem('chatz_saved_session');
            window.location.reload();
        };

        joinGroupBtn.onclick = () => {
            const roomName = groupNameInput.value.trim();
            if (roomName) {
                socket.emit('joinGroup', roomName);
                groupNameInput.value = '';
            }
        };

        socket.on('groupJoined', (roomName) => {
            joinedGroups.add(roomName);
            renderGroupsList();
            openChat(roomName, true);
        });

        function renderGroupsList() {
            groupsList.innerHTML = '';
            joinedGroups.forEach(room => {
                const item = document.createElement('div');
                item.classList.add('contact-item');
                if (isGroupChat && activeTarget === room) item.classList.add('active');
                item.innerHTML = `<span style="font-size:1.3rem">👥</span> <b>#${room}</b>`;
                item.onclick = () => openChat(room, true);
                groupsList.appendChild(item);
            });
        }

        socket.on('updateUserList', (userList) => {
            contactsList.innerHTML = '';
            userList.forEach(user => {
                if (user.username !== currentUser) {
                    const item = document.createElement('div');
                    item.classList.add('contact-item');
                    if (!isGroupChat && activeTarget === user.username) item.classList.add('active');

                    const avatarHtml = user.pfp.startsWith('data:image') 
                        ? `<img src="${user.pfp}" style="width:30px; height:30px; border-radius:50%; object-fit:cover;">`
                        : `<span style="font-size:1.3rem">${user.pfp || '👤'}</span>`;

                    item.innerHTML = `${avatarHtml} <b>${user.username}</b> <span style="margin-left:auto; font-size:0.7rem; color:#00a884;">● online</span>`;
                    item.onclick = () => openChat(user.username, false);
                    contactsList.appendChild(item);
                }
            });
        });

        function openChat(target, groupFlag) {
            activeTarget = target;
            isGroupChat = groupFlag;

            activeContactName.textContent = isGroupChat ? `#${target}` : target;
            activeStatusSub.textContent = isGroupChat ? '👥 Public Group Chat' : '🔒 End-to-End Encrypted Direct Message';

            emptyView.classList.add('hidden');
            activeChatView.classList.remove('hidden');
            chatBody.innerHTML = '';

            chatArea.classList.add('mobile-active');

            renderGroupsList();
            socket.emit('loadConversation', { target, isGroup: isGroupChat });
        }

        mobileBackBtn.onclick = () => chatArea.classList.remove('mobile-active');

        messageInput.addEventListener('input', () => {
            if (!activeTarget) return;
            socket.emit('typing', { target: activeTarget, isGroup: isGroupChat, isTyping: true });

            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                socket.emit('typing', { target: activeTarget, isGroup: isGroupChat, isTyping: false });
            }, 1500);
        });

        socket.on('userTyping', (data) => {
            if ((!isGroupChat && data.from === activeTarget) || (isGroupChat && data.room === activeTarget)) {
                if (data.isTyping) {
                    activeStatusSub.textContent = `💬 ${data.from} is typing...`;
                    activeStatusSub.style.color = '#38bdf8';
                } else {
                    activeStatusSub.textContent = isGroupChat ? '👥 Public Group Chat' : '🔒 End-to-End Encrypted Direct Message';
                    activeStatusSub.style.color = '#00a884';
                }
            }
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                selectedFileName = file.name;
                selectedFileType = file.type;

                const reader = new FileReader();
                reader.onload = (evt) => selectedFileData = evt.target.result;
                reader.readAsDataURL(file);
            }
        });

        function sendDirectPayload(msgText, fileData, fileType, fileName) {
            if (!activeTarget) return;
            let msgData = msgText;

            if (!isGroupChat && msgText) {
                const secret = getSharedSecret(currentUser, activeTarget);
                msgData = encryptDecrypt(msgText, secret);
            }

            socket.emit('sendMessage', {
                recipient: isGroupChat ? null : activeTarget,
                room: isGroupChat ? activeTarget : null,
                message: msgData,
                fileData: fileData || '',
                fileName: fileName || '',
                fileType: fileType || ''
            });
        }

        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();

            if (text || selectedFileData) {
                sendDirectPayload(text, selectedFileData, selectedFileType, selectedFileName);
                messageInput.value = '';
                fileInput.value = '';
                selectedFileData = '';
                selectedFileName = '';
                selectedFileType = '';
            }
        });

        socket.on('conversationHistory', (data) => {
            if (data.target === activeTarget) {
                chatBody.innerHTML = '';
                const secret = !isGroupChat ? getSharedSecret(currentUser, activeTarget) : null;

                data.history.forEach(item => {
                    item.decryptedMessage = (!isGroupChat && item.message) ? decrypt(item.message, secret) : item.message;
                    appendBubble(item);
                });
            }
        });

        socket.on('receiveMessage', (data) => {
            const matchesDirect = !isGroupChat && ((data.sender === currentUser && data.recipient === activeTarget) || (data.sender === activeTarget && data.recipient === currentUser));
            const matchesGroup = isGroupChat && data.room === activeTarget;

            const secret = !isGroupChat ? getSharedSecret(currentUser, activeTarget) : null;
            data.decryptedMessage = (!isGroupChat && data.message) ? decrypt(data.message, secret) : data.message;

            if (matchesDirect || matchesGroup) {
                appendBubble(data);
                if (!isGroupChat && data.sender === activeTarget) {
                    socket.emit('markAsRead', { sender: activeTarget });
                }
            }

            // TRIGGER PUSH NOTIFICATION FOR INCOMING MESSAGES
            if (data.sender !== currentUser) {
                triggerPushNotification(`New message from ${data.sender}`, {
                    body: data.decryptedMessage || 'Sent a file/attachment',
                    icon: '💬'
                });
            }
        });

        socket.on('messagesMarkedRead', (data) => {
            if (!isGroupChat && data.by === activeTarget) {
                document.querySelectorAll('.tick-icon').forEach(tick => {
                    tick.textContent = '✓✓';
                    tick.classList.add('read');
                });
            }
        });

        socket.on('reactionUpdated', ({ msgId, reactions }) => {
            const bubbleEl = document.getElementById(`msg-${msgId}`);
            if (bubbleEl) {
                const reactionBox = bubbleEl.querySelector('.reactions-display');
                const parsed = JSON.parse(reactions || '{}');
                const uniqueEmojis = [...new Set(Object.values(parsed))].join(' ');
                if (reactionBox) reactionBox.textContent = uniqueEmojis;
            }
        });

        function appendBubble(data) {
            const isOutgoing = data.sender === currentUser;
            const bubble = document.createElement('div');
            bubble.classList.add('bubble', isOutgoing ? 'outgoing' : 'incoming');
            bubble.id = `msg-${data.id}`;

            let bodyContent = `
                <div class="reaction-bar">
                    <span class="reaction-btn" onclick="reactToMessage(${data.id}, '❤️')">❤️</span>
                    <span class="reaction-btn" onclick="reactToMessage(${data.id}, '😂')">😂</span>
                    <span class="reaction-btn" onclick="reactToMessage(${data.id}, '👍')">👍</span>
                    <span class="reaction-btn" onclick="reactToMessage(${data.id}, '😮')">😮</span>
                    <span class="reaction-btn" onclick="reactToMessage(${data.id}, '🔥')">🔥</span>
                </div>
            `;

            if (isGroupChat && !isOutgoing) {
                bodyContent += `<div class="sender-tag">${data.sender}</div>`;
            }

            if (data.decryptedMessage) bodyContent += `<div>${data.decryptedMessage}</div>`;

            if (data.fileData) {
                const type = data.fileType || '';
                if (type === 'sticker') {
                    bodyContent += `<div style="font-size: 3.5rem; text-align: center;">${data.fileData}</div>`;
                } else if (type.startsWith('image/')) {
                    bodyContent += `<img src="${data.fileData}" class="chat-img" />`;
                } else if (type.startsWith('video/')) {
                    bodyContent += `<video src="${data.fileData}" controls class="chat-video"></video>`;
                } else if (type.startsWith('audio/')) {
                    bodyContent += `<audio src="${data.fileData}" controls class="chat-audio"></audio>`;
                } else {
                    bodyContent += `<a href="${data.fileData}" download="${data.fileName || 'download'}" style="color:#38bdf8;">💾 Download ${data.fileName || 'File'}</a>`;
                }
            }

            let tickStr = '';
            let tickClass = 'tick-icon';

            if (isOutgoing && !isGroupChat) {
                if (data.status === 'read') {
                    tickStr = '✓✓';
                    tickClass = 'tick-icon read';
                } else if (data.status === 'delivered') {
                    tickStr = '✓✓';
                } else {
                    tickStr = '✓';
                }
            }

            const parsedReactions = JSON.parse(data.reactions || '{}');
            const emojisStr = [...new Set(Object.values(parsedReactions))].join(' ');

            bodyContent += `
                <div class="reactions-display">${emojisStr}</div>
                <div class="bubble-footer">
                    <span class="bubble-time">${data.time || ''}</span>
                    ${isOutgoing && !isGroupChat ? `<span class="${tickClass}">${tickStr}</span>` : ''}
                </div>
            `;

            bubble.innerHTML = bodyContent;
            chatBody.appendChild(bubble);
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        window.reactToMessage = function(msgId, emoji) {
            socket.emit('addReaction', { msgId, emoji, target: activeTarget, isGroup: isGroupChat });
        };

        function launchCall(startWithAudioOnly) {
            if (!activeTarget) return;

            const callRoomName = isGroupChat 
                ? `chatz-group-${activeTarget.toLowerCase().replace(/[^a-z0-9]/g, '')}`
                : `chatz-dm-${[currentUser, activeTarget].sort().join('-')}`;

            socket.emit('startCallNotification', {
                target: activeTarget,
                isGroup: isGroupChat,
                callRoomName,
                isAudioOnly: startWithAudioOnly,
                senderPfp: currentPfp
            });

            joinJitsiRoom(callRoomName, startWithAudioOnly);
        }

        function joinJitsiRoom(callRoomName, startWithAudioOnly) {
            callOverlay.classList.remove('hidden');
            incomingCallModal.classList.add('hidden');
            jitsiContainer.innerHTML = '';

            const domain = 'meet.jit.si';
            const options = {
                roomName: callRoomName,
                width: '100%',
                height: '100%',
                parentNode: jitsiContainer,
                userInfo: { displayName: currentUser },
                configOverwrite: {
                    startAudioOnly: startWithAudioOnly,
                    disableDeepLinking: true,
                    prejoinPageEnabled: false,
                    enableWelcomePage: false,
                    startWithAudioMuted: false,
                    startWithVideoMuted: startWithAudioOnly,
                    resolution: 360,
                    p2p: { enabled: true }
                },
                interfaceConfigOverwrite: {
                    TOOLBAR_BUTTONS: ['microphone', 'camera', 'desktop', 'hangup', 'tileview'],
                    SHOW_JITSI_WATERMARK: false
                }
            };

            jitsiApi = new JitsiMeetExternalAPI(domain, options);
            const iframe = jitsiApi.getIFrame();
            if (iframe) iframe.setAttribute('allow', 'camera; microphone; display-capture; autoplay; clipboard-write');

            jitsiApi.addEventListeners({ videoConferenceLeft: closeCallUI });
        }

        socket.on('incomingCall', (data) => {
            currentIncomingCall = data;
            const typeText = data.isAudioOnly ? 'Incoming Audio Call...' : 'Incoming Video Call...';
            
            callerNameDisplay.textContent = data.isGroup ? `${data.from} (#${data.groupName})` : data.from;
            callTypeSubtitle.textContent = typeText;

            if (data.senderPfp && data.senderPfp.startsWith('data:image')) {
                callerAvatarDisplay.innerHTML = `<img src="${data.senderPfp}" style="width:100%; height:100%; border-radius:50%; object-fit:cover;">`;
            } else {
                callerAvatarDisplay.textContent = data.senderPfp || '👤';
            }

            incomingCallModal.classList.remove('hidden');

            // PUSH NOTIFICATION FOR CALLS
            triggerPushNotification(`Incoming Call from ${data.from}`, {
                body: typeText,
                icon: '📞'
            });
        });

        acceptIncomingCallBtn.onclick = () => {
            if (currentIncomingCall) {
                joinJitsiRoom(currentIncomingCall.callRoomName, currentIncomingCall.isAudioOnly);
            }
        };

        declineIncomingCallBtn.onclick = () => {
            if (currentIncomingCall && !currentIncomingCall.isGroup) {
                socket.emit('declineCall', { to: currentIncomingCall.from });
            }
            incomingCallModal.classList.add('hidden');
            currentIncomingCall = null;
        };

        socket.on('callDeclined', ({ from }) => {
            alert(`${from} declined the call.`);
            closeCallUI();
        });

        endCallBtn.onclick = closeCallUI;

        function closeCallUI() {
            if (jitsiApi) {
                jitsiApi.dispose();
                jitsiApi = null;
            }
            callOverlay.classList.add('hidden');
            incomingCallModal.classList.add('hidden');
            jitsiContainer.innerHTML = '';
        }

        audioCallBtn.onclick = () => launchCall(true);
        videoCallBtn.onclick = () => launchCall(false);
    </script>
</body>
</html>
